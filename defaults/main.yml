---
# System description shown by the default templates
banner_system_description: This system is managed by Ansible!

# Pre-login banner for /etc/issue and /etc/issue.net
# This content can be customized by providing your own template
banner_issue_template: "{{ '\n' ~ lookup('ansible.builtin.template', 'issue.j2') ~ '\n' }}"

# Post-login message for /etc/motd
# By default, setting this value to an empty string will clear the existing MOTD content.
banner_motd_template: "{{ '\n' ~ lookup('ansible.builtin.template', 'motd.j2') ~ '\n' }}"

# Disable all scripts in /etc/update-motd.d
banner_motd_disable_dynamic: true
banner_motd_dynamic_exceptions:
  - 92-unattended-upgrades
  # - 98-reboot-required
